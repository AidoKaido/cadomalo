<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Secure Checkout – Cadomalo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .redir-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;}
    .redir-logo{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;margin-bottom:32px;color:var(--dark);}
    .redir-logo span{color:var(--cr);}
    .redir-spin{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--cr);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .redir-msg{font-size:1rem;color:var(--dark);font-weight:600;margin-bottom:8px;}
    .redir-sub{font-size:.84rem;color:var(--mid);max-width:380px;line-height:1.5;}
    .redir-err{display:none;margin-top:24px;padding:16px;background:var(--cr-xl);border:1px solid rgba(156,2,2,.2);border-radius:var(--r8);max-width:420px;color:var(--cr);font-size:.84rem;}
    .redir-actions{margin-top:24px;display:none;gap:10px;}
    .redir-actions.show{display:flex;}
  </style>
</head>
<body>
<div class="redir-wrap">
  <a href="index.html" class="redir-logo">cado<span>malo</span></a>
  <div class="redir-spin" id="redir-spin"></div>
  <p class="redir-msg" id="redir-msg">Redirecting to secure checkout…</p>
  <p class="redir-sub">Your payment is processed by Stripe over a 256-bit SSL encrypted connection.</p>
  <div class="redir-err" id="redir-err"></div>
  <div class="redir-actions" id="redir-actions">
    <a href="cart.html" class="btn btn-ghost btn-sm">Back to cart</a>
    <a href="shop.html" class="btn btn-primary btn-sm">Continue shopping</a>
  </div>
</div>

<script src="js/pixels.js"></script>
<script src="js/main.js"></script>
<script>
(async function(){
  const msg = document.getElementById('redir-msg');
  const spin = document.getElementById('redir-spin');
  const err = document.getElementById('redir-err');
  const actions = document.getElementById('redir-actions');

  function fail(text) {
    spin.style.display = 'none';
    msg.textContent = 'Checkout could not start';
    err.textContent = text;
    err.style.display = 'block';
    actions.classList.add('show');
  }

  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('cadomalo_cart') || '[]'); } catch (e) {}

  if (!cart.length) {
    fail('Your cart is empty. Add an item before checking out.');
    return;
  }

  try {
    const res = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cart: cart.map((x) => ({
          slug: x.slug,
          quantity: x.quantity,
          variantId: x.variantId || null,
          personalization: x.personalization || null
        }))
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.url) throw new Error(data.error || ('Checkout error (' + res.status + ')'));
    if (typeof window.fbTrack?.initiateCheckout === 'function') {
      const subtotal = cart.reduce((a, x) => a + (Number(x.unitPrice) || 0) * (Number(x.quantity) || 0), 0);
      window.fbTrack.initiateCheckout({ value: subtotal, currency: 'USD' });
    }
    window.location.href = data.url;
  } catch (e) {
    console.error('[checkout-redirect]', e);
    fail(e.message || 'Something went wrong. Please go back to your cart and try again.');
  }
})();
</script>
</body>
</html>
