name: Auto-alias cadomalo.com to latest production

on:
  schedule:
    # Every 5 minutes (GitHub runs cron at best-effort, expect 5-15 min lag).
    - cron: '*/5 * * * *'
  workflow_dispatch:  # also runnable manually from the Actions tab

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Point cadomalo.com at the latest READY production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_F841MaslQWoPn14BJn0uIf5TfdTV
          TEAM_ID: team_iQpzDhMKA3hYpct90Sk10eRe
          DOMAIN: cadomalo.com
        run: |
          set -euo pipefail
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          # Find the latest READY production deployment.
          LATEST=$(curl -sS -H "$AUTH" \
            "$API/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=10&state=READY&target=production" \
            | jq -r '.deployments[0].url')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No READY production deployment found."
            exit 0
          fi
          echo "Latest READY production: $LATEST"

          # Find current alias target.
          CURRENT=$(curl -sS -H "$AUTH" \
            "$API/v4/aliases?domain=$DOMAIN&teamId=$TEAM_ID" \
            | jq -r '.aliases[] | select(.alias=="'"$DOMAIN"'") | .deployment.url' \
            | head -1)
          echo "Current $DOMAIN alias points to: ${CURRENT:-<none>}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already up-to-date — nothing to do."
            exit 0
          fi

          # Re-alias.
          RES=$(curl -sS -w "\n%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"alias\":\"$DOMAIN\"}" \
            "$API/v2/deployments/$LATEST/aliases?teamId=$TEAM_ID")
          STATUS=$(echo "$RES" | tail -1)
          BODY=$(echo "$RES" | sed '$d')
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✓ Aliased $DOMAIN → $LATEST"
          else
            echo "✗ Alias failed ($STATUS): $BODY"
            exit 1
          fi
